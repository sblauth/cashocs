name: Tests (macos, serial)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

permissions: read-all

env:
  OMP_NUM_THREADS: 1
  OMPI_MCA_op: "^avx"
  OMPI_MCA_pml: "ob1"
  OMPI_MCA_btl: "self,tcp"
  OMPI_MCA_plm_ssh_agent: "false"
  OMPI_MCA_mpi_yield_when_idle: "true"
  OMPI_MCA_btl_base_warn_component_unused: "false"
  OMPI_MCA_rmaps_base_oversubscribe: "true"
  PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
  MPIR_CVAR_NOLOCAL: "1"
  FI_PROVIDER: "tcp"
  MPIR_CVAR_CH4_XPMEM_ENABLE: "0"
  MPIR_CVAR_ENABLE_GPU: "0"
  MPIR_CVAR_DEVICE_COLLECTIVES: "none"
  HYDRA_LAUNCHER: "fork"


jobs:
  serial_tests:
    name: Test (py=${{ matrix.python-version}}, macos-15)
    runs-on: macos-15
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Create conda environment
      uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
      with:
        environment-file: .github/conda/mpich.yml
        miniforge-version: latest
        python-version: ${{ matrix.python-version }}
        activate-environment: test
        auto-activate: false
        conda-remove-defaults: true

    - name: Show conda info
      run: conda info

    - name: Show list of all installed packages
      run: conda list

    - name: Install package
      run: |
        pip install .[all]

    - name: Run tests
      run: |
        python3 -m pytest -vv
 
