name: Release on GitHub and PyPI

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  run_tests:
    name: Run tests before publishing
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sblauth/cashocs:main
      options: --user=root
    env:
      OMP_NUM_THREADS: 1

    steps:
    - name: Delete current installation in docker image
      shell: bash
      run: |
        conda run --no-capture-output -n env pip uninstall -y cashocs
        rm -rf /opt/app/{*,.*}

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install cashocs
      shell: bash
      run: |
        conda run --no-capture-output -n env pip install .[all]

    - name: Run tests
      shell: bash
      run: |
        conda run --no-capture-output -n env python3 -m pytest -vv tests/


  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - run_tests
    permissions:
      contents: write
    steps:
    
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


    - name: Get tag name
      id: tag_name
      run: |
        echo "TAG_PREFIX=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT


    - name: Check if release is a pre-release
      id: check_version
      uses: nowsprinting/check-version-format-action@2946b47fb3590f88fc80b3579e72cd15c0fa90cb # v5.0.4
      with:
        prefix: 'v'


    - name: Create Github release
      id: create_release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        name: cashocs ${{ steps.tag_name.outputs.TAG_PREFIX }}
        generate_release_notes: ${{ steps.check_version.outputs.is_stable == 'true' }}
        prerelease: ${{ steps.check_version.outputs.is_stable == 'false' }}


  build_and_publish:
    name: Build and publish python package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    needs:
      - run_tests

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.14

    - name: Install pypa/build
      run: python -m pip install build --user

    - name: Build a binary wheel and a source tarball
      run: python -m build --sdist --wheel --outdir dist/ .

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
