name: Tests (ubuntu, parallel)

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '03 22 * * *'

permissions: read-all

env:
  OMP_NUM_THREADS: 1
  SCOTCH_DETERMINISTIC: 1
  SCOTCH_RANDOM_FIXED_SEED: 1
  OMPI_MCA_op: "^avx"
  OMPI_MCA_pml: "ob1"
  OMPI_MCA_btl: "self,tcp"
  OMPI_MCA_plm_ssh_agent: "false"
  OMPI_MCA_mpi_yield_when_idle: "true"
  OMPI_MCA_btl_base_warn_component_unused: "false"
  OMPI_MCA_rmaps_base_oversubscribe: "true"
  PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"

jobs:
  parallel_tests:
    name: Test (py=${{ matrix.python-version}}, ${{ matrix.mpi }})
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        mpi: [mpich, openmpi]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Create conda environment
      uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
      with:
        environment-file: .github/conda/${{ matrix.mpi }}.yml
        miniforge-version: latest
        python-version: ${{ matrix.python-version }}
        activate-environment: test
        auto-activate: false
        conda-remove-defaults: true

    - name: Show conda info
      run: conda info

    - name: Show list of all installed packages
      run: conda list

    - name: Install package
      run: |
        pip install .[all]
    
    - name: Run tests in parallel
      run: |
        mpirun -n 2 python3 -m pytest -vv --timeout=1800 -p no:cacheprovider --randomly-seed=${{ github.run_id }}
